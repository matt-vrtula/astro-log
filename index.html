<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroLog</title>
  </head>
  <body>
    <!-- Sign-in page: shown when no user is signed in -->
    <section id="sign-in-view" class="sign-in" hidden>
      <div class="sign-in-card">
        <h1>AstroLog</h1>
        <p class="tagline">Sign in to continue</p>
        <button id="google-sign-in" class="google-btn" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
        <p id="sign-in-error" class="error" role="alert" hidden></p>
      </div>
    </section>

    <!-- Main app: shown when a user is signed in -->
    <div id="app-view" hidden>
      <header class="app-header">
        <h1>AstroLog</h1>
        <div class="user-menu">
          <button
            id="user-button"
            class="avatar-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="user-dropdown"
            aria-label="Account menu"
          >
            <img id="user-avatar" alt="" referrerpolicy="no-referrer" hidden />
            <span id="user-initials" aria-hidden="true"></span>
          </button>
          <div id="user-dropdown" class="dropdown" role="menu" hidden>
            <div class="dropdown-header">
              <div id="user-name" class="dropdown-name"></div>
              <div id="user-email" class="dropdown-email"></div>
            </div>
            <button id="sign-out" class="dropdown-item" type="button" role="menuitem">
              Log out
            </button>
          </div>
        </div>
      </header>
      <main id="content"></main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
